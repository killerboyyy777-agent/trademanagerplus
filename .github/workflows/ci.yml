name: Plugin-ci

on: [push, pull_request]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

permissions:
  contents: read

jobs:
  main:
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        os: [macos-latest, ubuntu-latest, windows-latest]
        asf: [6, 7]
        include:
        - asf: 6
          asf_tag: 6.3.11.7
        - asf: 7
          asf_tag: 7.0.0.7

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      with:
        show-progress: false
        submodules: recursive

    - name: Switch ArchiSteamFarm to ASF 7
      if: matrix.asf == 7
      shell: bash
      run: |
        git -C ArchiSteamFarm fetch origin tag "${{ matrix.asf_tag }}" --no-tags
        git -C ArchiSteamFarm checkout "${{ matrix.asf_tag }}"
        git -C ArchiSteamFarm submodule update --init --recursive

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@2016bd2012dba4e32de620c46fe006a3ac9f0602 # v5.0.1
      with:
        dotnet-version: 10.0.x

    - name: Setup .NET 11 SDK
      if: matrix.asf == 7
      uses: actions/setup-dotnet@2016bd2012dba4e32de620c46fe006a3ac9f0602 # v5.0.1
      with:
        dotnet-version: 11.0.100-rc.3.26522.148
        dotnet-quality: preview

    - name: Verify .NET Core
      run: dotnet --info

    - name: Build ASF ${{ matrix.asf }} ${{ matrix.configuration }}
      run: dotnet build -c "${{ matrix.configuration }}" -p:AsfMajor=${{ matrix.asf }} -p:ContinuousIntegrationBuild=true -p:UseAppHost=false --nologo

    - name: Test ASF ${{ matrix.asf }} ${{ matrix.configuration }}
      run: dotnet test TradeManagerPlus.Tests/TradeManagerPlus.Tests.csproj -c "${{ matrix.configuration }}" --no-build --nologo -p:AsfMajor=${{ matrix.asf }}
